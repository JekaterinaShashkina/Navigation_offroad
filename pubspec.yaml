name: offroad_nav
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.9
  latlong2: ^0.8.0

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.12.3
  geojson: ^1.0.0
  flutter_dotenv: ^5.0.2
  flutter_svg: ^2.2.0
  geolocator: ^10.0.0
  location: ^5.0.3
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.1
  firebase_database: ^11.3.9
  image_picker: ^1.1.0
  firebase_storage: ^12.4.10
  flutter_compass: ^0.8.1
  google_sign_in: ^7.1.1
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  rxdart: ^0.28.0
  http: ^1.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1 

flutter:
  uses-material-design: true 


  assets:
    - .env
    - assets/geo/kr_kaitseala.geojson
    - assets/images/
    - assets/images/eeWAY/
    - assets/images/groups_avatars/
    - assets/data/country_codes.json
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular-400.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium-500.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold-600.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold-700.ttf
          weight: 700

# Конфиг генератора иконок — корневой уровень
flutter_launcher_icons:
  ios: true
  android: false                 # не трогаем Android
  remove_alpha_ios: true
  image_path_ios: assets/images/eeWAY/eeWay_favicon_must.png
